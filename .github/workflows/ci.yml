# .github/workflows/ci.yml
name: CI
on:
  push: { branches: [main] }
  pull_request:

# Dependabot only edits package.json (it has no bun.lock support), so on
# Dependabot PRs we regenerate bun.lock and push it back to the branch.
permissions: { contents: write }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the PR branch tip (not the detached merge ref) so the
          # bun.lock sync step below can push back to it. Empty on push events,
          # where checkout falls back to the triggering ref.
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        # Detect Dependabot by branch name, not github.actor — the actor
        # becomes the human who re-runs or pushes to the PR, but the branch
        # stays dependabot/*.
        env:
          IS_DEPENDABOT: ${{ startsWith(github.head_ref, 'dependabot/') }}
        run: |
          if [ "$IS_DEPENDABOT" = "true" ]; then
            # Dependabot bumps package.json but leaves bun.lock stale, so a
            # frozen install would fail. Regenerate the lockfile instead.
            echo "Dependabot PR: regenerating bun.lock to match package.json"
            bun install
          else
            bun install --frozen-lockfile
          fi
      - name: Sync bun.lock (Dependabot only)
        if: startsWith(github.head_ref, 'dependabot/')
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): sync bun.lock with package.json"
            git push
          fi
      - run: bun run ci
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        env:
          IS_DEPENDABOT: ${{ startsWith(github.head_ref, 'dependabot/') }}
        run: |
          if [ "$IS_DEPENDABOT" = "true" ]; then
            echo "Dependabot PR: regenerating bun.lock to match package.json"
            bun install
          else
            bun install --frozen-lockfile
          fi
      - run: bun run --filter '@nebari/starlight' build
      - run: bun test packages/starlight/test
      - run: cd docs && bun test
      - run: cd docs && bunx playwright install --with-deps chromium && bun run e2e
